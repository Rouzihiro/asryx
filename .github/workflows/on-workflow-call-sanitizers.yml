name: runtime safety

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: base runner
        uses: ./.github/actions/base-runner

      - name: project install
        uses: ./.github/actions/project-install
        with:
          dev: "true"

      - name: runtime safety
        run: just s
